version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: datawise-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-AI-Data-Analyst}
    volumes:
      - ./Backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/Frontend
      dockerfile: Dockerfile
    container_name: datawise-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

